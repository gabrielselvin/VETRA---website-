<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — VETRA</title>
<meta name="description" content="You are currently offline. Reconnect to continue browsing VETRA.">
<link rel="icon" type="image/png" href="assets/vetra-logo-dark.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="status-page">

  </div>

  <script src="script.js"></script>
</body>
